services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: validation
      POSTGRES_USER: validation
      POSTGRES_PASSWORD: validation
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validation"]
      interval: 5s
      retries: 12
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &backend_env
      DATABASE_URL: postgresql://validation:validation@db:5432/validation
      STORAGE_PATH: /data/documents
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_GENERATION_TIMEOUT: ${OLLAMA_GENERATION_TIMEOUT:-900}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct-q4_K_M}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text:v1.5}
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["documents:/data/documents"]
    depends_on:
      db:
        condition: service_healthy
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.worker"]
    environment: *backend_env
    volumes: ["documents:/data/documents"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres:
  documents:
